<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#28a745" opacity="0.1" stroke="#28a745" stroke-width="2"/>
  
  <!-- Octopus head -->
  <circle cx="100" cy="70" r="35" fill="#28a745"/>
  
  <!-- Octopus eyes -->
  <circle cx="88" cy="60" r="6" fill="white"/>
  <circle cx="112" cy="60" r="6" fill="white"/>
  <circle cx="88" cy="60" r="3" fill="#28a745"/>
  <circle cx="112" cy="60" r="3" fill="#28a745"/>
  
  <!-- Octopus smile -->
  <path d="M 85 75 Q 100 82 115 75" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Octopus tentacles (dumbbells) -->
  <!-- Left tentacle 1 -->
  <rect x="60" y="100" width="8" height="50" fill="#28a745" rx="4"/>
  <circle cx="64" cy="155" r="12" fill="#ffc107"/>
  <circle cx="64" cy="100" r="8" fill="#ffc107"/>
  
  <!-- Left tentacle 2 -->
  <rect x="40" y="110" width="8" height="45" fill="#28a745" rx="4" transform="rotate(-25 44 110)"/>
  <circle cx="30" cy="155" r="11" fill="#ffc107"/>
  <circle cx="48" cy="115" r="7" fill="#ffc107"/>
  
  <!-- Right tentacle 1 -->
  <rect x="132" y="100" width="8" height="50" fill="#28a745" rx="4"/>
  <circle cx="136" cy="155" r="12" fill="#ffc107"/>
  <circle cx="136" cy="100" r="8" fill="#ffc107"/>
  
  <!-- Right tentacle 2 -->
  <rect x="152" y="110" width="8" height="45" fill="#28a745" rx="4" transform="rotate(25 156 110)"/>
  <circle cx="170" cy="155" r="11" fill="#ffc107"/>
  <circle cx="152" cy="115" r="7" fill="#ffc107"/>
  
  <!-- Fitness barbell -->
  <line x1="70" y1="130" x2="130" y2="130" stroke="#007bff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="65" cy="130" r="6" fill="#007bff"/>
  <circle cx="135" cy="130" r="6" fill="#007bff"/>
</svg>